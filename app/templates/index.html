<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>商品列表</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;max-width:760px;margin:30px auto;padding:0 20px}
nav{margin-bottom:16px}nav a{margin-right:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:1px solid #eee;border-radius:10px;padding:12px;text-align:center}
.card img{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#f3f4f6}
.name{font-weight:700;margin:8px 0 2px}
.price{color:#d97706}
.stock{color:#6b7280;font-size:12px}
button{padding:6px 14px;cursor:pointer;margin-top:6px}
#status{color:#16a34a;margin-top:12px}
</style>
</head>
<body>
<nav><a href="/">商品</a><a href="/cart_page">购物车</a><span id="login-state"></span></nav>
<h2>商品列表</h2>
<div class="grid" id="products"></div>
<div id="status"></div>
<script>
const token = localStorage.getItem("token");
if (token) document.getElementById("login-state").textContent = "（已登录）";

const IMG_BASE = "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?image_size=square&prompt=";
function imgUrl(name) { return IMG_BASE + encodeURIComponent(name + " 电商商品白底图"); }

async function load() {
  const res = await fetch("/products");
  const data = await res.json();
  document.getElementById("products").innerHTML = data.products.map(p => `
    <div class="card" data-testid="product" data-id="${p.id}">
      <img src="${imgUrl(p.name)}" alt="${p.name}" onerror="this.style.visibility='hidden'">
      <div class="name" data-testid="name">${p.name}</div>
      <div class="price" data-testid="price">¥${p.price}</div>
      <div class="stock" data-testid="stock">库存 ${p.stock}</div>
      <button data-testid="add-${p.id}" onclick="addCart('${p.id}')">加购</button>
    </div>`).join("");
}
async function addCart(pid) {
  if (!token) { location.href = "/login"; return; }
  const res = await fetch("/cart", {
    method: "POST", headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
    body: JSON.stringify({product_id: pid, quantity: 1})
  });
  document.getElementById("status").textContent = res.ok ? "已加入购物车" : "加购失败";
}
load();
</script>
</body>
</html>

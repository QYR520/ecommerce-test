<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>订单详情</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;max-width:640px;margin:30px auto;padding:0 20px}
nav{margin-bottom:16px}nav a{margin-right:14px}
div{margin:8px 0}
button{padding:8px 18px;cursor:pointer}
</style>
</head>
<body>
<nav><a href="/">商品</a><a href="/cart_page">购物车</a></nav>
<h2>订单详情</h2>
<div id="order"></div>
<button id="pay-btn">支付</button>
<div id="msg"></div>
<script>
const token = localStorage.getItem("token");
const oid = location.pathname.split("/").pop();
async function load() {
  const res = await fetch("/order/" + oid, {headers: {"Authorization": "Bearer " + token}});
  const data = await res.json();
  document.getElementById("order").innerHTML = `
    <div>订单号 ${data.order.id}</div>
    <div>实付 ¥<span data-testid="pay_amount">${data.order.pay_amount}</span></div>
    <div data-testid="status">状态 ${data.order.status}</div>`;
  if (data.order.status !== "unpaid") document.getElementById("pay-btn").disabled = true;
}
document.getElementById("pay-btn").onclick = async function () {
  await fetch("/order/" + oid + "/pay", {
    method: "POST", headers: {"Authorization": "Bearer " + token}
  });
  load();
};
load();
</script>
</body>
</html>

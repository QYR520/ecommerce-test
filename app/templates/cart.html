<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>购物车</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;max-width:640px;margin:30px auto;padding:0 20px}
nav{margin-bottom:16px}nav a{margin-right:14px}
.item{border-bottom:1px solid #eee;padding:12px 0;display:flex;align-items:center;gap:12px}
.name{font-weight:700;flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;padding:0}
.subtotal{margin-top:14px;font-weight:700}
.actions{margin-top:10px}
button{padding:7px 16px;cursor:pointer}
#result{margin-top:14px}
</style>
</head>
<body>
<nav><a href="/">商品</a><a href="/cart_page">购物车</a></nav>
<h2>购物车</h2>
<div id="cart"></div>
<div class="subtotal" id="subtotal"></div>
<div class="actions">
  <button id="order-btn">下单</button>
  <button id="clear-btn">清空购物车</button>
</div>
<div id="result"></div>
<script>
const token = localStorage.getItem("token");
let cartItems = [];

async function load() {
  const res = await fetch("/cart", {headers: {"Authorization": "Bearer " + token}});
  if (res.status === 401) { location.href = "/login"; return; }
  const data = await res.json();
  cartItems = data.items;
  document.getElementById("cart").innerHTML = cartItems.length
    ? cartItems.map(it => `
      <div class="item" data-testid="cart-item">
        <span class="name">${it.name}</span>
        <span>¥${it.price}</span>
        <span class="qty">
          <button data-testid="minus-${it.id}" onclick="changeQty(${it.id}, -1)">−</button>
          <span data-testid="qty-${it.id}">${it.quantity}</span>
          <button data-testid="plus-${it.id}" onclick="changeQty(${it.id}, 1)">+</button>
        </span>
      </div>`).join("")
    : "<div>购物车为空</div>";
  const subtotal = cartItems.reduce((s, it) => s + it.price * it.quantity, 0);
  document.getElementById("subtotal").textContent = "商品合计 ¥" + subtotal.toFixed(2);
}

async function changeQty(cid, delta) {
  const item = cartItems.find(it => it.id === cid);
  const nq = item.quantity + delta;
  if (nq <= 0) {
    await fetch("/cart/" + cid, {method: "DELETE", headers: {"Authorization": "Bearer " + token}});
  } else {
    await fetch("/cart/" + cid, {
      method: "PUT", headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
      body: JSON.stringify({quantity: nq})
    });
  }
  load();
}

document.getElementById("clear-btn").onclick = async function () {
  await fetch("/cart", {method: "DELETE", headers: {"Authorization": "Bearer " + token}});
  load();
};

document.getElementById("order-btn").onclick = async function () {
  const items = cartItems.map(it => ({product_id: it.product_id, quantity: it.quantity}));
  const res = await fetch("/order", {
    method: "POST", headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
    body: JSON.stringify({items: items})
  });
  const data = await res.json();
  if (res.ok) {
    document.getElementById("result").innerHTML =
      `下单成功，订单号 ${data.order_id}，实付 ¥<span data-testid="pay_amount">${data.pay_amount}</span> ` +
      `<a data-testid="view-order" href="/orders/${data.order_id}">查看订单</a>`;
  } else {
    document.getElementById("result").textContent = "下单失败：" + (data.error || "");
  }
};
load();
</script>
</body>
</html>
